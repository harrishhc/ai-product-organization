name: Methodology Registry Sync

on:
  push:
    branches: [main, phase-3-methodology-genesis]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[registry-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild local methodology registry
        run: node scripts/build-methodology-registry.mjs
      - name: Commit registry when changed
        run: |
          if git diff --quiet -- methodology/registry/ecosystem.json; then
            echo "Registry is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add methodology/registry/ecosystem.json
          git commit -m "chore: sync methodology registry [registry-sync]"
          git push
